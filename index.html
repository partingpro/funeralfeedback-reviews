<!DOCTYPE html>
<html>
<head>
  <title>Funeral Feedback</title>
  <!-- Start the connection to Jotform's domain in parallel with the /api/lookup
       call instead of after, since the iframe below depends on it. -->
  <link rel="preconnect" href="https://form.jotform.com">
  <link rel="dns-prefetch" href="https://form.jotform.com">
</head>
<body>
  <div id="form-container">Loading form...</div>
  <script>
    // The Airtable token now lives server-side in the /api/lookup Pages
    // Function (env var), not in this file. filterByFormula on the server
    // means a match is found no matter how many rows the table has — the old
    // maxRecords=100 fetch silently missed anything past row 100.
    const slug = window.location.pathname.replace("/", "");
    fetch(`/api/lookup?slug=${encodeURIComponent(slug)}`)
    .then(res => res.json())
    .then(data => {
      if (data.jotform_url) {
        document.getElementById('form-container').innerHTML =
          `<iframe src="${data.jotform_url}" width="100%" height="800px" frameborder="0"></iframe>`;
      } else {
        document.getElementById('form-container').innerText = "Form not found.";
      }
    })
    .catch(err => {
      document.getElementById('form-container').innerText = "Error loading form.";
      console.error(err);
    });
  </script>
</body>
</html>
